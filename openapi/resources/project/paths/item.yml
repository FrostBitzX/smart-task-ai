paths:
  /api/projects/{projectId}:
    get:
      operationId: GetProject
      summary: Get project by ID
      description: Get project by ID
      tags:
        - project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            example: "proj_KwSysDpxcBU9FNhGkn2dCf"
      responses:
        "200":
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../../shared/schemas/success.yml"
                  - type: object
                    properties:
                      data:
                        $ref: "../schemas/get-project-response.yml"
        "400":
          $ref: "../../../shared/responses/bad-request.yml"
        "401":
          $ref: "../../../shared/responses/unauthorized.yml"
        "403":
          $ref: "../../../shared/responses/forbidden.yml"
        "404":
          $ref: "../../../shared/responses/not-found.yml"
        "500":
          $ref: "../../../shared/responses/internal-server-error.yml"
    patch:
      operationId: UpdateProject
      summary: Update project by ID
      description: Update project by ID
      tags:
        - project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            example: "proj_KwSysDpxcBU9FNhGkn2dCf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/update-project-request.yml"
      responses:
        "200":
          description: Project updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../../shared/schemas/success.yml"
                  - type: object
                    properties:
                      message:
                        example: "Project updated successfully"
                      data:
                        $ref: "../schemas/update-project-response.yml"
        "400":
          $ref: "../../../shared/responses/bad-request.yml"
        "401":
          $ref: "../../../shared/responses/unauthorized.yml"
        "403":
          $ref: "../../../shared/responses/forbidden.yml"
        "404":
          $ref: "../../../shared/responses/not-found.yml"
        "500":
          $ref: "../../../shared/responses/internal-server-error.yml"
    delete:
      operationId: DeleteProject
      summary: Delete project
      description: Delete project by ID
      tags:
        - project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            example: "proj_KwSysDpxcBU9FNhGkn2dCf"
      responses:
        "200":
          description: Project deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../../shared/schemas/success.yml"
                  - type: object
                    properties:
                      message:
                        example: "Project deleted successfully"
                      data:
                        $ref: "../schemas/delete-project-response.yml"
        "400":
          $ref: "../../../shared/responses/bad-request.yml"
        "401":
          $ref: "../../../shared/responses/unauthorized.yml"
        "403":
          $ref: "../../../shared/responses/forbidden.yml"
        "404":
          $ref: "../../../shared/responses/not-found.yml"
        "500":
          $ref: "../../../shared/responses/internal-server-error.yml"

  /api/projects/{projectId}/members:
    get:
      operationId: ListProjectMembers
      summary: List project members
      description: Retrieve all members of a project
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project ID with prefix (e.g., proj_xxx)
          schema:
            type: string
            pattern: "^proj_[a-zA-Z0-9]+$"
      responses:
        "200":
          description: Members retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Members retrieved successfully
                  data:
                    $ref: "../schemas/list-members-response.yml"
                  error:
                    type: "null"
        "400":
          $ref: "../../../shared/responses/bad-request.yml"
        "401":
          $ref: "../../../shared/responses/unauthorized.yml"
        "500":
          $ref: "../../../shared/responses/internal-server-error.yml"

    post:
      operationId: AddProjectMember
      summary: Add member to project
      description: Add a new member to a project with specified role
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project ID with prefix (e.g., proj_xxx)
          schema:
            type: string
            pattern: "^proj_[a-zA-Z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/add-member-request.yml"
      responses:
        "200":
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Member added successfully
                  data:
                    $ref: "../schemas/add-member-response.yml"
                  error:
                    type: "null"
        "400":
          $ref: "../../../shared/responses/bad-request.yml"
        "401":
          $ref: "../../../shared/responses/unauthorized.yml"
        "404":
          $ref: "../../../shared/responses/not-found.yml"
        "500":
          $ref: "../../../shared/responses/internal-server-error.yml"

  /api/projects/{projectId}/members/{accountId}:
    delete:
      operationId: RemoveProjectMember
      summary: Remove member from project
      description: Remove a member from a project (cannot remove owner)
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project ID with prefix (e.g., proj_xxx)
          schema:
            type: string
            pattern: "^proj_[a-zA-Z0-9]+$"
        - name: accountId
          in: path
          required: true
          description: Account ID with prefix (e.g., acc_xxx)
          schema:
            type: string
            pattern: "^acc_[a-zA-Z0-9]+$"
      responses:
        "200":
          description: Member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Member removed successfully
                  data:
                    $ref: "../schemas/remove-member-response.yml"
                  error:
                    type: "null"
        "400":
          $ref: "../../../shared/responses/bad-request.yml"
        "401":
          $ref: "../../../shared/responses/unauthorized.yml"
        "404":
          $ref: "../../../shared/responses/not-found.yml"
        "500":
          $ref: "../../../shared/responses/internal-server-error.yml"
