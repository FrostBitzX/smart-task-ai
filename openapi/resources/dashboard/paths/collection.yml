paths:
  /api/dashboard/statistics:
    get:
      tags:
        - dashboard
      summary: Get task statistics
      description: Returns task counts grouped by status (todo, in_progress, in_review, done) aggregated across all projects the user is a member of
      operationId: getTaskStatistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../../shared/schemas/success.yml"
                  - type: object
                    properties:
                      data:
                        $ref: "../schemas/task-statistics-response.yml"
        '401':
          $ref: "../../../shared/responses/unauthorized.yml"
        '500':
          $ref: "../../../shared/responses/internal-server-error.yml"

  /api/dashboard/unscheduled-tasks:
    get:
      tags:
        - dashboard
      summary: Get unscheduled tasks
      description: Returns tasks with status todo or in_progress that have no start_date and no end_date, from all projects the user is a member of
      operationId: getUnscheduledTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unscheduled tasks retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../../shared/schemas/success.yml"
                  - type: object
                    properties:
                      data:
                        $ref: "../schemas/unscheduled-tasks-response.yml"
        '401':
          $ref: "../../../shared/responses/unauthorized.yml"
        '500':
          $ref: "../../../shared/responses/internal-server-error.yml"

  /api/dashboard/today-tasks:
    get:
      tags:
        - dashboard
      summary: Get today's tasks
      description: Returns tasks with status todo or in_progress where start_date equals today's date, from all projects the user is a member of
      operationId: getTodayTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Today's tasks retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../../shared/schemas/success.yml"
                  - type: object
                    properties:
                      data:
                        $ref: "../schemas/today-tasks-response.yml"
        '401':
          $ref: "../../../shared/responses/unauthorized.yml"
        '500':
          $ref: "../../../shared/responses/internal-server-error.yml"
